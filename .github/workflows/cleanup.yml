name: 🧹 Limpieza de Usuarios Invitados

on:
  schedule:
    # Se ejecuta todos los domingos a las 03:00 UTC (noche del sábado)
    - cron: '0 3 * * 0'
  workflow_dispatch: # Permite ejecutarlo manualmente con un botón desde GitHub

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: 📦 Instalar dependencias del script
        run: npm install firebase-admin dotenv
        
      - name: 🧹 Ejecutar script de limpieza
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/cleanup-anonymous.js
