<!doctype html>
<html lang="es" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="mask-icon" href="/mask-icon.svg" color="#8b5cf6" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />

  <!-- SEO Primary -->
  <title>AnotaGym: Tu Agenda para el Gym | Registro de Entrenamiento</title>
  <meta name="description"
    content="AnotaGym — Tu agenda inteligente para el gimnasio. Registra rutinas, series y progreso. Estimaciones de 1RM en tiempo real, historial sincronizado y acceso desde cualquier dispositivo." />
  <meta name="keywords"
    content="gym tracker, registro entrenamiento, diario gym, rutinas gym, seguimiento pesas, 1RM, progressive overload, AnotaGym" />
  <!-- Cuando se compre anotagym.app, actualizar canonical y og:url al dominio nuevo -->
  <link rel="canonical" href="https://anotagym.vercel.app" />

  <!-- Open Graph (redes sociales) -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://anotagym.vercel.app" />
  <meta property="og:title" content="AnotaGym: Tu Agenda para el Gym" />
  <meta property="og:description"
    content="Registra tus rutinas, sigue tu progreso y sincroniza en todos tus dispositivos. Gratis, sin anuncios." />
  <meta property="og:locale" content="es_ES" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="AnotaGym: Tu Agenda para el Gym" />
  <meta name="twitter:description"
    content="Registra tus rutinas, sigue tu progreso y sincroniza en todos tus dispositivos. Gratis, sin anuncios." />

  <!-- PWA / Apple -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AnotaGym" />
  <meta name="theme-color" content="#201B17" />

  <!-- Splash mínimo: se pinta al instante (antes de descargar el JS) y React lo
       sustituye al montar. Evita la pantalla negra vacía en arranques lentos. -->
  <style>
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: #09090b; z-index: 9999;
    }
    #splash .logo {
      width: 52px; height: 52px; border-radius: 14px; background: #d99b7c;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; animation: splash-pulse 1.2s ease-in-out infinite;
    }
    #splash p { color: #a1a1aa; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; margin: 0; }
    @keyframes splash-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.9); opacity: 0.7; } }
  </style>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=Figtree:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
</head>

<body
  class="font-sans bg-zinc-50 dark:bg-[#09090b] text-zinc-900 dark:text-zinc-100 antialiased overscroll-none selection:bg-indigo-500/30">
  <div id="splash" aria-hidden="true">
    <div class="logo">🏋️</div>
    <p>AnotaGym</p>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
